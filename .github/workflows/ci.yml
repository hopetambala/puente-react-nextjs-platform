name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run integration tests
        run: yarn test:integration
        env:
          # Tell mongodb-memory-server to use a shared binary path so it can
          # be cached across CI runs rather than re-downloaded each time.
          MONGOMS_PREFER_GLOBAL_PATH: 1

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

  # ── E2E ────────────────────────────────────────────────────────────────────
  # NON-BLOCKING on purpose. These drive a real browser against a real Parse
  # backend, so they are flaky by nature — and a suite that blocks merges before
  # it has earned trust is how an E2E suite ends up deleted. It reports; it does
  # not gate. Promote it to blocking only once `--repeat 3` is consistently
  # PROMOTABLE in CI, which is what the stability gate exists to tell you.
  #
  # Requires two repo secrets pointing at STAGING (never production — the write
  # guard refuses the production app id and the job will fail closed):
  #   E2E_PARSE_APP_ID, E2E_PARSE_JS_KEY
  # Without them the job skips rather than pretending to pass.
  e2e:
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for staging credentials
        id: creds
        run: |
          if [ -n "${{ secrets.E2E_PARSE_APP_ID }}" ] && [ -n "${{ secrets.E2E_PARSE_JS_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped — set E2E_PARSE_APP_ID and E2E_PARSE_JS_KEY (STAGING) to enable."
          fi

      - name: Install Playwright browser
        if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write the staging environment
        if: steps.creds.outputs.present == 'true'
        run: |
          cat > .env.development.local <<EOF
          NEXT_PUBLIC_parseAppId=${{ secrets.E2E_PARSE_APP_ID }}
          NEXT_PUBLIC_parseJavascriptKey=${{ secrets.E2E_PARSE_JS_KEY }}
          NEXT_PUBLIC_parseServerUrl="https://parseapi.back4app.com/"
          EOF

      - name: Start the dev server
        if: steps.creds.outputs.present == 'true'
        run: |
          yarn dev &
          npx wait-on http://localhost:3000 --timeout 120000

      # Read-only suites only. The write suites stay out of CI until someone
      # decides that a shared staging database should be mutated on every push.
      - name: Run E2E (read-only suites, stability gate)
        if: steps.creds.outputs.present == 'true'
        run: node e2e/run-e2e.mjs sign-in dashboard craft features --repeat 2
        env:
          PARSE_USERNAME: ${{ secrets.E2E_PARSE_USERNAME || 'Test' }}
          PARSE_PASSWORD: ${{ secrets.E2E_PARSE_PASSWORD || 'test' }}

      # NO ARTIFACT UPLOAD. This repository is PUBLIC, and .e2e-artifacts/
      # contains full-page screenshots of the authenticated app plus 1200
      # characters of visible body text per failure — i.e. real field-data
      # records. Publishing that to a world-readable artifact must be a
      # deliberate decision, not a debugging convenience. Read failures from the
      # job log, or reproduce locally where the artifacts are written.
