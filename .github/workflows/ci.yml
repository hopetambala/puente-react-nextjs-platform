name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Blocking since PR 1a. app/ and pages/ are at zero errors, with
      # plugin:jsx-a11y/strict on; the violations that predate it are per-file
      # "warn" overrides in .eslintrc.json, each naming the PR that removes it.
      # Warnings still print, so the backlog stays visible.
      - name: Run ESLint
        run: yarn lint

      # The E2E harness is .mjs and lives outside next.config.js's lint dirs,
      # so `next lint` never saw a line of it. It reported 47 errors the first
      # time it was pointed at this directory.
      #
      # Deliberately NOT continue-on-error, unlike the step above: app/ still
      # carries a warning backlog that would drown a real signal, but e2e/ is
      # at zero errors and zero warnings as of this commit, so anything new is
      # something a person just introduced. `yarn lint:e2e --fix` fixes most.
      - name: Run ESLint on the E2E harness
        run: yarn lint:e2e

      # Stylelint with the a11y rules (no outline removal, no px font sizes,
      # tokens for colour and z-index, dvh not 100vh, :focus-visible). Fails on
      # any count above stylelint-baseline.json, and on any count below it that
      # wasn't recorded with `yarn lint:css:baseline`.
      - name: Run stylelint (a11y rules, ratcheting baseline)
        run: yarn lint:css

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run integration tests
        run: yarn test:integration
        env:
          # Tell mongodb-memory-server to use a shared binary path so it can
          # be cached across CI runs rather than re-downloaded each time.
          MONGOMS_PREFER_GLOBAL_PATH: 1

  # ── A11Y GATE ─────────────────────────────────────────────────────────────
  # docs/responsive-a11y-overhaul.md, "A11y tooling stack". jest-axe and the
  # undefined-token test run in unit-tests; jsx-a11y and stylelint in lint.
  # Each layer has a checked-in known-failures list that later PRs shrink;
  # anything new fails here.

  # axe on every Storybook story at dlite's sm/md/lg/xl breakpoints.
  storybook-a11y:
    # Same pin as e2e: Playwright 1.60 can't install Chromium deps on 26.04.
    runs-on: ubuntu-24.04
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Storybook a11y (build, serve, axe every story)
        run: yarn test-storybook

  # Every route × 320/375/768/1024/1440 × eng/spa: axe, reflow, target size,
  # text spacing, focus. BLOCKING, unlike the e2e job below: it runs against
  # the synthetic world (e2e/lib/synthetic-world.mjs), so it needs no secrets,
  # writes nothing, and doesn't depend on what is in staging today.
  responsive-a11y:
    runs-on: ubuntu-24.04
    needs: lint
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Placeholders, not credentials. Every Parse call is answered by the
      # synthetic world's stubs before it leaves the browser; the SDK only
      # needs an app id and a URL to build its requests.
      - name: Write a placeholder environment
        run: |
          cat > .env.production.local <<EOF
          NEXT_PUBLIC_parseAppId=a11y-sweep-placeholder
          NEXT_PUBLIC_parseJavascriptKey=a11y-sweep-placeholder
          NEXT_PUBLIC_parseServerUrl="https://parseapi.back4app.com/"
          EOF

      # A production build, not `next dev`: no per-route compile on first
      # visit, so 170 page loads don't race a compiler.
      - name: Build and start the app
        run: |
          yarn build
          yarn start &
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Responsive a11y sweep (stability gate)
        run: node e2e/run-e2e.mjs responsive-a11y --repeat 2

      # Same reason as the e2e job: no artifact upload. The sweep's screenshots
      # are of synthetic data, but .e2e-artifacts/ is shared with suites that
      # capture real records, so nothing from it is published by default.

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, storybook-a11y, responsive-a11y]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.storybook-a11y.result }}" != "success" ] || \
             [ "${{ needs.responsive-a11y.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

  # ── E2E ────────────────────────────────────────────────────────────────────
  # NON-BLOCKING on purpose. These drive a real browser against a real Parse
  # backend, so they are flaky by nature — and a suite that blocks merges before
  # it has earned trust is how an E2E suite ends up deleted. It reports; it does
  # not gate. Promote it to blocking only once `--repeat 3` is consistently
  # PROMOTABLE in CI, which is what the stability gate exists to tell you.
  #
  # Requires two repo secrets pointing at STAGING (never production — the write
  # guard refuses the production app id and the job will fail closed):
  #   E2E_PARSE_APP_ID, E2E_PARSE_JS_KEY
  # Without them the job skips rather than pretending to pass.
  e2e:
    # Pinned: `ubuntu-latest` moved to 26.04 in Nov 2026, and Playwright 1.60
    # cannot install Chromium's system dependencies there ("does not support
    # chromium on ubuntu26.04-x64"), so the job failed before any test ran.
    # Move this forward when Playwright supports the newer image.
    runs-on: ubuntu-24.04
    needs: lint
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for staging credentials
        id: creds
        run: |
          if [ -n "${{ secrets.E2E_PARSE_APP_ID }}" ] && [ -n "${{ secrets.E2E_PARSE_JS_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped — set E2E_PARSE_APP_ID and E2E_PARSE_JS_KEY (STAGING) to enable."
          fi

      - name: Install Playwright browser
        if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write the staging environment
        if: steps.creds.outputs.present == 'true'
        run: |
          cat > .env.development.local <<EOF
          NEXT_PUBLIC_parseAppId=${{ secrets.E2E_PARSE_APP_ID }}
          NEXT_PUBLIC_parseJavascriptKey=${{ secrets.E2E_PARSE_JS_KEY }}
          NEXT_PUBLIC_parseServerUrl="https://parseapi.back4app.com/"
          EOF

      - name: Start the dev server
        if: steps.creds.outputs.present == 'true'
        run: |
          yarn dev &
          npx wait-on http://localhost:3000 --timeout 120000

      # Read-only suites only. The write suites stay out of CI until someone
      # decides that a shared staging database should be mutated on every push.
      - name: Run E2E (read-only suites, stability gate)
        if: steps.creds.outputs.present == 'true'
        run: node e2e/run-e2e.mjs sign-in dashboard craft features --repeat 2
        env:
          PARSE_USERNAME: ${{ secrets.E2E_PARSE_USERNAME || 'Test' }}
          PARSE_PASSWORD: ${{ secrets.E2E_PARSE_PASSWORD || 'test' }}

      # NO ARTIFACT UPLOAD. This repository is PUBLIC, and .e2e-artifacts/
      # contains full-page screenshots of the authenticated app plus 1200
      # characters of visible body text per failure — i.e. real field-data
      # records. Publishing that to a world-readable artifact must be a
      # deliberate decision, not a debugging convenience. Read failures from the
      # job log, or reproduce locally where the artifacts are written.
